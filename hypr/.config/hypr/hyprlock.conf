$wallpaper = ~/.local/state/hypr/blurred-wallpaper.png
$avatar = ~/.config/hypr/assets/anime-wifu.png

background {
    path = $wallpaper
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 1
}

label {
    monitor =
    text = cmd[update:1000] echo -e -n "╭────────────  " && echo -n -e $(date +"%Y-%m-%d") && echo -e -n "  ────────────╮"
    color = rgba(255, 255, 255, 1)
    font_size = 30
    font_family = IosevkaNerdFontMono-Regular
    position = 0, -35
    halign = center
    valign = top
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo $(date +"%I:%M %p")
    font_size = 125 
    font_family = IosevkaNerdFontMono-Regular
    position = 0, -50
    halign = center
    valign = top
}

# Day
label {
    monitor =
    text = cmd[update:1000] echo -e -n "╰─────────────── " && echo -n -e $(date +"%A" | cut -c 1-10) && echo -e -n " ───────────────╯"
    color = rgba(255, 255, 255, 1)
    font_size = 30
    font_family = IosevkaNerdFontMono-Regular
    position = 0, -250
    halign = center
    valign = top
}

image {
	monitor =
	path = $avatar
	size = 400
    rounding = 30
	border_size = 4
    border_color = rgba(255, 255, 255, 0)
	position = 0, -50
	halign = center
	valign = center
}

input-field {
    monitor =
    size = 15%, 4%
    dots_size = 0.3
    dots_spacing = 0.1
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(255, 255, 255, 0.3)
    inner_color = rgba(255, 255, 255, 0.3)
    fade_on_empty = false
    font_family = IosevkaNerdFontMono-Regular
    placeholder_text = <b>enter me daddy 😋</b>
    hide_input = false
    rounding = 20
    fail_color = rgb(255, 123, 123)
    fail_text = <b>is u retarded 🥀🥀</b>
    position = 0, -300
    halign = center
    valign = center
}

