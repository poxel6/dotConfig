include theme.conf

font_family      family="Iosevka Nerd Font Mono"
fallback_family  NotoColorEmoji
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 20

window_padding_width 6
#hide_window_decorations yes
tab_bar_edge top

background_opacity 0.75
dynamic_background_opacity yes
background_blur 10

cursor_trail 10
cursor_trail_start_treshold 0
cursor_trail_decay 0.1 0.2
cursor_shape block
cursor_blink true

confirm_os_window_close 0

map ctrl+alt+h previous_tab
map ctrl+alt+l next_tab
map alt+e launch --type=window --cwd=current ~/.local/share/bin/tmux-sessionizer
