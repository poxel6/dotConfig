CompileFlags:
  Add: [
    -I../include,
    -I../.,
    -std=c23,
    -DLOCAL,
    -Wall,
    -Wextra,
    -Wconversion,
    -Wsign-conversion,
    -Wunreachable-code
    -Wshadow,
    -Wcast-qual,
    -Wcast-align,
    -Wundef,
    -Wmissing-prototypes,
    -Wattributes,
    -Wimplicit-int,
    -Wimplicit-function-declaration,
    -Wincompatible-pointer-types,
    -Wint-conversion,
    -Wmain,
    -Wpointer-arith,
    -Wpointer-sign,
    -Wincompatible-pointer-types,
  ]

Diagnostics:
  UnusedIncludes: Strict

Completion:
  ArgumentLists: Delimiters
  IncludeFixIts: true
  HeaderInsertion: IWYU


InlayHints:
  ParameterNames: true
  DeducedTypes: true
  Designators: true
  BlockEnd: true
  DefaultArguments: true

Documentation:
  CommentFormat: Doxygen

