CompileFlags:
  Add: [
    -I../include,
    -DLOCAL,
    -Wall,
    -Wextra,
    -Wpedantic,
    -Wconversion,
    -Wsign-conversion,
    -Wshadow,
    -Wcast-qual,
    -Wcast-align,
    -Wformat=2,
    -Wundef,
    -Wstrict-prototypes,
    -Wmissing-prototypes,
    -Werror
  ]

Diagnostics:
  UnusedIncludes: Strict

Completion:
  ArgumentLists: Delimiters

InlayHints:
  ParameterNames: true
  DeducedTypes: true
  Designators: true
  BlockEnd: true
  DefaultArguments: true

Documentation:
  CommentFormat: Doxygen

